dist: focal
language: java
# might be useful to push reports to an S3 bucket
#  artifacts:
#    paths:
#      - $(find $HOME -name surefire-reports | tr "\n" ":")
#      - $(find $HOME -name failsafe-reports | tr "\n" ":")
#  s3_region: 'us-west-2'
cache:
  directories:
    - $HOME/.m2
before_install:
  # oraclejdk8 / oracle-java8-installer can no longer be provisioned; the engine compiles
  # javafx.beans.* value extractors, so use a JDK 8 that bundles JavaFX (Azul Zulu 8 FX)
  - curl -fsSL --retry 5 --retry-delay 5 -o /tmp/zulu8fx.tar.gz https://cdn.azul.com/zulu/bin/zulu8.96.0.205-ca-fx-jdk8.0.504-linux_x64.tar.gz
  - mkdir -p $HOME/zulu8fx && tar -xzf /tmp/zulu8fx.tar.gz -C $HOME/zulu8fx --strip-components=1
  - export JAVA_HOME=$HOME/zulu8fx
  # archive.apache.org is unreachable from Travis workers; fetch the Maven 3.9.5 distribution from Maven Central
  - curl -fsSL --retry 5 --retry-delay 5 -o /tmp/maven.tar.gz https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.5/apache-maven-3.9.5-bin.tar.gz
  - mkdir -p $HOME/maven395 && tar -xzf /tmp/maven.tar.gz -C $HOME/maven395 --strip-components=1
  - export PATH=$JAVA_HOME/bin:$HOME/maven395/bin:$PATH
install:
  - java -version
  - mvn -v
  # first run installs every module without tests so the checkstyle plugin can resolve the
  # build-config artifact, as upstream does (checkstyle, license and forbidden-apis stay enabled)
  - travis_wait mvn -U -B -ntp -q -Dcheckstyle.skip -DskipTests=true install
script:
  - mvn -B -ntp -DskipDistro=true checkstyle:check
    && mvn -B -ntp -Dcheckstyle.skip clean install
  - python3 .travis/test-summary.py
after_script:
  - sh .travis/wait-for-log.sh maven
before_cache:
  # Do not put Hibernate Validator artifacts into the cache
  - rm -rf $HOME/.m2/repository/org/hibernate/validator/ $HOME/.m2/repository/org/hibernate/hibernate-validator*
